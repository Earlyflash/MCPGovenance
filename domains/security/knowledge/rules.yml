# Security guidance. PoC content: replace with your organisation's real standards.
# The reviewer detects; this file explains. Owners change guidance with an ordinary pull request.
rules:
  - id: SEC-001
    title: Hard-coded secret
    severity: block
    confidence: high
    tags: [secrets, credentials, tokens, keys, password]
    summary: A credential, key or token is written into source control, where it is visible to everyone with read access and persists in history.
    guidance: >-
      Secrets must never be committed. Read them at runtime from the environment or a secrets manager.
      If one has been committed it is compromised: rotate it first, then remove it. Deleting the line is not enough.
    remediation: Remove the value, load it from an environment variable or secrets manager, and rotate the exposed credential.
    exemplars:
      bad: |
        DB_PASSWORD = "hunter2hunter2"
      good: |
        import os
        DB_PASSWORD = os.environ["DB_PASSWORD"]  # injected by the platform from the secrets manager

  - id: SEC-002
    title: Shell command built for execution
    severity: warn
    confidence: medium
    tags: [injection, subprocess, shell, command]
    summary: Running commands through a shell (shell=True, os.system) turns any untrusted input in the command into command injection.
    guidance: >-
      Pass an argument list to subprocess without a shell. If a shell is genuinely required, the input must be
      constant or strictly validated, and the reason recorded in a waiver.
    remediation: Use subprocess.run([...], shell=False) with an argument list, or request a waiver explaining why a shell is needed.
    exemplars:
      bad: |
        subprocess.run(f"convert {filename} out.png", shell=True)
      good: |
        subprocess.run(["convert", filename, "out.png"], check=True)

  - id: SEC-003
    title: TLS certificate verification disabled
    severity: block
    confidence: high
    tags: [tls, https, certificates, verify, mitm]
    summary: Disabling certificate verification removes the protection HTTPS provides and allows man-in-the-middle attacks.
    guidance: >-
      Never disable certificate verification, including in test or development code that can be copied elsewhere.
      Trust an internal certificate authority by configuring its certificate bundle instead.
    remediation: Remove the override. If an internal CA is involved, point the client at its CA bundle (for example verify="/etc/ssl/internal-ca.pem").
    exemplars:
      bad: |
        requests.get(url, verify=False)
      good: |
        requests.get(url, verify="/etc/ssl/internal-ca.pem")

  - id: SEC-004
    title: Dynamic code evaluation
    severity: block
    confidence: medium
    tags: [eval, exec, injection, code]
    summary: eval, exec and new Function run text as code, so any attacker-influenced string becomes arbitrary code execution.
    guidance: >-
      Parse data with a data parser (json, ast.literal_eval) and dispatch behaviour through explicit lookup tables,
      not by evaluating strings.
    remediation: Replace eval/exec with a parser or an explicit mapping of allowed operations.
    exemplars:
      bad: |
        result = eval(user_expression)
      good: |
        import ast
        value = ast.literal_eval(user_value)   # literals only, never code

  - id: SEC-005
    title: Container runs as root
    severity: warn
    confidence: high
    tags: [docker, container, root, user]
    summary: A container whose final stage has no non-root USER runs as root, which widens the impact of any compromise.
    guidance: Create an unprivileged user in the image and switch to it before the entrypoint.
    remediation: Add a non-root USER in the final stage of the Dockerfile.
    exemplars:
      bad: |
        FROM python:3.12-slim
        COPY . /app
        CMD ["python", "/app/app.py"]
      good: |
        FROM python:3.12-slim
        RUN useradd --create-home app
        COPY --chown=app . /app
        USER app
        CMD ["python", "/app/app.py"]

  - id: SEC-006
    title: Network rule open to the whole internet
    severity: warn
    confidence: medium
    tags: [terraform, network, security-group, ingress, cidr]
    summary: A rule allowing 0.0.0.0/0 or ::/0 exposes the resource to every address on the internet.
    guidance: Scope ingress to known CIDR ranges or security groups. Public ingress is acceptable only behind an approved load balancer or CDN.
    remediation: Restrict the CIDR to the ranges that need access, or reference a security group.
    exemplars:
      bad: |
        cidr_blocks = ["0.0.0.0/0"]
      good: |
        cidr_blocks = [var.office_cidr]
